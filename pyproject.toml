[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cc-voice"
version = "0.1.0"
description = "A voice interface for Claude Code: talk to your coding agent, hear it answer."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Nicholas Yuan" }]
keywords = ["claude", "claude-code", "voice", "speech", "stt", "tts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "sounddevice>=0.5",
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cc-voice = "cc_voice.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cc_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
